[package]
name = "editdistpy"
version = "0.3.0"
edition = "2024"
description = "Fast Levenshtein and Damerau optimal string alignment algorithms."
authors = ["mmb L"]
repository = "https://github.com/mammothb/editdistpy"
license = "MIT"

[lib]
name = "editdistpy"
crate-type = ["cdylib"]

[dependencies]
ahash = { version = "0.8.12" }
pyo3 = { version = "0.28.3", features = ["generate-import-lib"] }

[dev-dependencies]
rstest = { version = "0.26.1" }
itertools = { version = "0.15" }

[features]
python = []
