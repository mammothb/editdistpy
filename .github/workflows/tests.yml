name: Tests
on:
  push:
    branches:
      - "main"
      - "master"
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - &rust-cache
        name: Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Setup - uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Check - Lint
        run: make lint
      - name: Check - Format
        run: make fmt
  test:
    name: Test (py${{ matrix.python-version }})
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *rust-cache
      - name: Setup - uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Test - Rust
        run: make test-rust
      - name: "Test - Rust (python feature)"
        run: make test-rust-python
      - name: Test - Python
        run: make test-python
