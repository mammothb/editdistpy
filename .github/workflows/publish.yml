name: Publish to TestPyPI and PyPI
on:
  workflow_dispatch:
    inputs:
      pypi_repo:
        description: "Repo to upload to (TestPyPI or PyPI)"
        type: choice
        default: "testpypi"
        options:
          - "testpypi"
          - "pypi"
permissions:
  contents: read
jobs:
  build_wheels:
    name: Build wheels
    uses: ./.github/workflows/wheels.yml
  test-publish:
    name: Publish - TestPyPI
    if: ${{ github.event.inputs.pypi_repo == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      contents: read
      id-token: write
    needs: [build_wheels]
    steps:
      - &download-artifact
        name: Download Artifacts - Wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: ./dist
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository_url: https://test.pypi.org/legacy/
  publish:
    name: Publish - PyPI
    if: ${{ github.event.inputs.pypi_repo == 'pypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    needs: [build_wheels]
    steps:
      - *download-artifact
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
